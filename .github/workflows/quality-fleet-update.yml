name: Fleet Update Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Fleet Discovery And Enrolment Tests
    runs-on: ${{ fromJSON(((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || !github.event.repository.private) && '["windows-2025"]' || (vars.RQG_WINDOWS_RUNS_ON || '["windows-2025"]')) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Fleet Discovery And Enrolment Tests
        shell: pwsh
        run: |
          ./tests/Invoke-RepositoryQualityGateFleetUpdate.Tests.ps1
          ./tests/Invoke-RepositoryQualityGateAppFleetUpdate.Tests.ps1
          ./tests/Get-RepositoryQualityGateReleasePlan.Tests.ps1
