name: Shell Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Shell Syntax
    runs-on: ${{ fromJSON(((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || !github.event.repository.private) && '["ubuntu-latest"]' || (vars.RQG_LINUX_RUNS_ON || '["ubuntu-latest"]')) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git ls-files -z '*.sh' '*.bash' | xargs -0 -r -n 1 bash -n
