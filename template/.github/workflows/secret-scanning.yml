name: Secret Scanning

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    name: Secret Scan
    runs-on: ${{ fromJSON(((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || !github.event.repository.private) && '["windows-2025"]' || (vars.RQG_WINDOWS_RUNS_ON || '["windows-2025"]')) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Verified Scanner
        shell: pwsh
        run: .\scripts\Install-Gitleaks.ps1
      - name: Scan Full History
        shell: pwsh
        run: .\scripts\Test-Secrets.ps1 -Mode History
      - name: Test Detection Policy
        shell: pwsh
        run: .\scripts\Test-DetectionPolicy.ps1
