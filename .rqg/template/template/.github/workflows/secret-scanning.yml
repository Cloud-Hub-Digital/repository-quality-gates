name: Secret Scanning

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    name: Secret Scan
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Verified Scanner
        shell: powershell
        run: .\scripts\Install-Gitleaks.ps1
      - name: Scan Full History
        shell: powershell
        run: .\scripts\Test-Secrets.ps1 -Mode History
      - name: Test Detection Policy
        shell: powershell
        run: .\scripts\Test-DetectionPolicy.ps1
