name: .NET Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: .NET Build And Test
    runs-on: ${{ fromJSON(((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || !github.event.repository.private) && '["windows-2025"]' || (vars.RQG_WINDOWS_RUNS_ON || '["windows-2025"]')) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Build Targets
        shell: pwsh
        run: |
          $targets = @(Get-ChildItem -File -Recurse | Where-Object {
            $_.Extension.ToLowerInvariant() -in @('.sln', '.slnx') -and $_.FullName -notmatch '[\\/](bin|obj)[\\/]'
          })
          if (-not $targets) {
            $targets = @(Get-ChildItem -File -Recurse | Where-Object {
              $_.Extension.ToLowerInvariant() -in @('.csproj', '.fsproj', '.vbproj') -and $_.FullName -notmatch '[\\/](bin|obj)[\\/]'
            })
          }
          if (-not $targets) { throw 'No .NET build target was found.' }
          $targets | ForEach-Object { $_.FullName } | Set-Content -LiteralPath "$env:RUNNER_TEMP\dotnet-targets.txt"
      - name: Restore, Build, And Test
        shell: pwsh
        run: |
          Get-Content -LiteralPath "$env:RUNNER_TEMP\dotnet-targets.txt" | ForEach-Object {
            dotnet restore $_
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            dotnet build $_ --configuration Release --no-restore
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            dotnet test $_ --configuration Release --no-build --no-restore
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
